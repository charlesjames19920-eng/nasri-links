
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nasri | اختصار الروابط</title>
<style>
*{box-sizing:border-box}
body{
margin:0;font-family:Arial,sans-serif;background:#0f172a;
color:#fff;min-height:100vh;display:grid;place-items:center;padding:20px
}
main{
width:100%;max-width:450px;background:#1e293b;padding:28px;
border-radius:20px;box-shadow:0 15px 40px #0005
}
h1{text-align:center;color:#60a5fa;font-size:36px;margin:0}
p{text-align:center;color:#cbd5e1;line-height:1.8}
label{display:block;margin:24px 0 10px}
input{
width:100%;padding:14px;border-radius:10px;border:1px solid #475569;
background:#0f172a;color:white;font-size:16px;direction:ltr
}
button{
width:100%;padding:14px;margin-top:14px;border:0;border-radius:10px;
background:#2563eb;color:white;font-size:17px;font-weight:bold
}
#result{display:none;margin-top:20px;overflow-wrap:anywhere}
#shortlink{color:#93c5fd;direction:ltr;display:block;margin-top:12px}
.note{font-size:12px}
</style>
</head>
<body>
<main>
<h1>Nasri</h1>
<p>اختصر روابطك الطويلة بسهولة ومجانًا</p>
<form id="form">
<label for="url">أدخل الرابط الذي تريد اختصاره</label>
<input id="url" type="url" placeholder="https://example.com" required>
<button type="submit">اختصر الرابط</button>
</form>
<div id="result">
<p>رابطك المختصر:</p>
<a id="shortlink" target="_blank" rel="noopener"></a>
<button id="copy" type="button">نسخ الرابط</button>
</div>
<p class="note">خدمة اختصار مجانية عبر is.gd</p>
</main>
<script>
const form=document.getElementById('form');
const result=document.getElementById('result');
const link=document.getElementById('shortlink');
form.addEventListener('submit',async function(e){
e.preventDefault();
const url=document.getElementById('url').value.trim();
if(!/^https?:\/\//i.test(url)){
alert('أدخل رابطًا يبدأ بـ https:// أو http://');return;
}
const button=form.querySelector('button');
button.disabled=true;button.textContent='جارٍ الاختصار...';
try{
const api='https://is.gd/create.php?format=json&url='+encodeURIComponent(url);
const response=await fetch(api);
const data=await response.json();
if(!data.shorturl)throw new Error(data.errormessage||'تعذر إنشاء الرابط');
link.href=data.shorturl;link.textContent=data.shorturl;
result.style.display='block';
}catch(err){
alert('تعذر الاختصار. حاول مرة أخرى أو تحقق من اتصال الإنترنت.');
}finally{
button.disabled=false;button.textContent='اختصر الرابط';
}
});
document.getElementById('copy').addEventListener('click',async()=>{
try{
await navigator.clipboard.writeText(link.href);
alert('تم نسخ الرابط');
}catch(e){
prompt('انسخ الرابط:',link.href);
}
});
</script>
</body>
</html>
