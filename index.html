
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101522">
  <title>Nasri | اختصار الروابط</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Tahoma, Arial, sans-serif;
      background: #101522;
      color: #f4f6fb;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 68px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      border-radius: 20px;
      background: linear-gradient(135deg, #6d5dfc, #3c8dff);
      font-size: 30px;
      font-weight: bold;
      box-shadow: 0 8px 30px #5145cd40;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 29px;
    }

    .subtitle {
      margin: 0;
      color: #a8b0c4;
      font-size: 14px;
      line-height: 1.8;
    }

    .card {
      background: #191f30;
      border: 1px solid #2a3248;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 15px 45px #00000025;
    }

    label {
      display: block;
      margin: 17px 0 9px;
      font-size: 14px;
      font-weight: bold;
      color: #e5e9f5;
    }

    label:first-child {
      margin-top: 0;
    }

    input {
      width: 100%;
      min-width: 0;
      padding: 14px;
      background: #101522;
      border: 1px solid #343d55;
      border-radius: 11px;
      color: #fff;
      font-size: 15px;
      outline: none;
      direction: ltr;
      text-align: left;
    }

    input:focus {
      border-color: #7c72ff;
      box-shadow: 0 0 0 3px #7c72ff20;
    }

    input::placeholder {
      color: #737e97;
    }

    .hint {
      color: #929bb1;
      font-size: 12px;
      line-height: 1.8;
      margin: 8px 0 0;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 14px;
      margin-top: 20px;
      background: linear-gradient(135deg, #7568ff, #438aff);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity .2s;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .status {
      display: none;
      margin-top: 17px;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .status.show {
      display: block;
      background: #101522;
      border: 1px solid #343d55;
    }

    .status.success {
      color: #8ce6b0;
      border-color: #286747;
    }

    .status.error {
      color: #ffaaa9;
      border-color: #773b46;
    }

    .result {
      display: none;
      margin-top: 18px;
      padding: 15px;
      background: #101522;
      border: 1px solid #343d55;
      border-radius: 12px;
    }

    .result-title {
      font-size: 13px;
      color: #a8b0c4;
      margin-bottom: 10px;
    }

    .shortlink {
      display: block;
      direction: ltr;
      text-align: center;
      overflow-wrap: anywhere;
      color: #8daaff;
      font-size: 17px;
      line-height: 1.8;
      text-decoration: none;
    }

    .shortlink:hover {
      text-decoration: underline;
    }

    .copy-button {
      background: #29334b;
      margin-top: 13px;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      color: #778198;
      font-size: 12px;
      margin-top: 20px;
      line-height: 1.9;
    }

    @media (max-width: 380px) {
      .card {
        padding: 18px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header">
      <div class="logo">N</div>
      <h1>Nasri</h1>
      <p class="subtitle">
        اختصر روابطك بسهولة واختر الكلمة التي تريدها.
      </p>
    </header>

    <section class="card">
      <form id="form">

        <label for="url">الرابط الأصلي</label>
        <input
          id="url"
          name="url"
          type="url"
          placeholder="https://example.com/page"
          autocomplete="url"
          required
        >

        <label for="alias">الكلمة المخصصة للرابط</label>
        <input
          id="alias"
          name="alias"
          type="text"
          placeholder="nasri2026"
          minlength="5"
          maxlength="30"
          pattern="[A-Za-z0-9_]{5,30}"
          title="من 5 إلى 30 حرفًا إنجليزيًا أو رقمًا أو شرطة سفلية"
          autocomplete="off"
          required
        >

        <p class="hint">
          استخدم من 5 إلى 30 حرفًا إنجليزيًا أو رقمًا أو _ فقط.
          يجب أن تكون الكلمة متاحة لدى خدمة الاختصار.
        </p>

        <button id="submit" type="submit">
          إنشاء الرابط المختصر
        </button>

      </form>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <div id="result" class="result">
        <div class="result-title">رابطك المختصر جاهز:</div>
        <a id="shortlink" class="shortlink"
           href="#" target="_blank" rel="noopener noreferrer"></a>
        <button id="copy" class="copy-button" type="button">
          نسخ الرابط
        </button>
      </div>
    </section>

    <footer class="footer">
      خدمة اختصار الروابط الشخصية Nasri
      <br>
      إنشاء الروابط يتم عبر خدمة is.gd الخارجية.
    </footer>

  </main>

  <script>
    (() => {
      const form = document.getElementById('form');
      const urlInput = document.getElementById('url');
      const aliasInput = document.getElementById('alias');
      const statusBox = document.getElementById('status');
      const resultBox = document.getElementById('result');
      const shortlink = document.getElementById('shortlink');
      const submitButton = document.getElementById('submit');
      const copyButton = document.getElementById('copy');

      let activeScript = null;
      let timeoutId = null;
      let requestNumber = 0;
      let callbackName = null;

      function showStatus(message, type = '') {
        statusBox.textContent = message;
        statusBox.className = 'status show' + (type ? ' ' + type : '');
      }

      function cleanRequest() {
        if (timeoutId !== null) {
          clearTimeout(timeoutId);
          timeoutId = null;
        }

        if (activeScript) {
          activeScript.remove();
          activeScript = null;
        }

        if (callbackName) {
          try {
            delete window[callbackName];
          } catch (_) {
            window[callbackName] = undefined;
          }
          callbackName = null;
        }
      }

      function finishRequest() {
        cleanRequest();
        submitButton.disabled = false;
        submitButton.textContent = 'إنشاء الرابط المختصر';
      }

      function validHttpUrl(value) {
        try {
          const parsed = new URL(value);
          return parsed.protocol === 'http:' ||
                 parsed.protocol === 'https:';
        } catch (_) {
          return false;
        }
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        const url = urlInput.value.trim();
        const alias = aliasInput.value.trim();

        if (!validHttpUrl(url)) {
          resultBox.style.display = 'none';
          showStatus(
            'أدخل رابطًا صحيحًا يبدأ بـ https:// أو http://',
            'error'
          );
          return;
        }

        if (!/^[A-Za-z0-9_]{5,30}$/.test(alias)) {
          resultBox.style.display = 'none';
          showStatus(
            'الكلمة يجب أن تتكون من 5 إلى 30 حرفًا إنجليزيًا أو رقمًا أو _',
            'error'
          );
          return;
        }

        cleanRequest();
        const thisRequest = ++requestNumber;

        resultBox.style.display = 'none';
        showStatus('جارٍ إنشاء الرابط، يرجى الانتظار...');
        submitButton.disabled = true;
        submitButton.textContent = 'جارٍ الإنشاء...';

        callbackName = 'nasriCallback_' + thisRequest;

        window[callbackName] = function (data) {
          if (thisRequest !== requestNumber) return;

          finishRequest();

          if (data && data.shorturl) {
            try {
              const createdUrl = new URL(data.shorturl);

              if (
                createdUrl.protocol !== 'https:' ||
                createdUrl.hostname !== 'is.gd'
              ) {
                showStatus('أعادت الخدمة رابطًا غير متوقع.', 'error');
                return;
              }

              shortlink.href = createdUrl.href;
              shortlink.textContent = createdUrl.href;
              resultBox.style.display = 'block';
              showStatus('تم إنشاء الرابط بنجاح!', 'success');
            } catch (_) {
              showStatus('أعادت الخدمة رابطًا غير صالح.', 'error');
            }

            return;
          }

          const code = Number(data && data.errorcode);
          const message = data && data.errormessage;

          if (code === 1) {
            showStatus('الرابط الأصلي غير صالح أو غير مقبول.', 'error');
          } else if (code === 2) {
            showStatus(
              'تعذر قبول الكلمة المخصصة. جرّب كلمة مختلفة.',
              'error'
            );
          } else if (code === 3) {
            showStatus(
              'أرسلت طلبات كثيرة. انتظر قليلًا ثم حاول مجددًا.',
              'error'
            );
          } else {
            showStatus(
              'لم تتم العملية: ' + (message || 'خطأ غير معروف من الخدمة.'),
              'error'
            );
          }
        };

        const params = new URLSearchParams({
          format: 'json',
          callback: callbackName,
          url: url,
          shorturl: alias
        });

        activeScript = document.createElement('script');
        activeScript.src =
          'https://is.gd/create.php?' + params.toString();
        activeScript.async = true;

        activeScript.onerror = function () {
          if (thisRequest !== requestNumber) return;

          finishRequest();
          showStatus(
            'تعذر الاتصال بخدمة is.gd. تحقق من الإنترنت وحاول لاحقًا.',
            'error'
          );
        };

        document.body.appendChild(activeScript);

        timeoutId = setTimeout(function () {
          if (thisRequest !== requestNumber) return;

          finishRequest();
          showStatus(
            'انتهت مهلة الاتصال بالخدمة. حاول مرة أخرى.',
            'error'
          );
        }, 15000);
      });

      aliasInput.addEventListener('input', function () {
        aliasInput.value = aliasInput.value.replace(
          /[^A-Za-z0-9_]/g,
          ''
        );
      });

      copyButton.addEventListener('click', async function () {
        const value = shortlink.href;

        if (!value || value === '#' || resultBox.style.display === 'none') {
          showStatus('أنشئ رابطًا مختصرًا أولًا.', 'error');
          return;
        }

        try {
          await navigator.clipboard.writeText(value);
          showStatus('تم نسخ الرابط بنجاح!', 'success');
        } catch (_) {
          window.prompt('انسخ الرابط التالي:', value);
        }
      });
    })();
  </script>
</body>
</html>
